<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onesearch Digest</title>
</head>
<body style="margin:0; padding:0; background:#ffffff; font-family:'Georgia', serif;">

  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff; padding:32px 0;">
    <tr>
      <td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">

          <!-- Banner -->
          <tr>
            <td style="line-height:0; border-radius:10px 10px 0 0; overflow:hidden;">
              <img src="cid:header" alt="Onesearch"
                   style="width:100%; max-width:560px; height:auto; display:block; border-radius:10px 10px 0 0;">
            </td>
          </tr>

          <!-- Main -->
          <tr>
            <td style="background:#ffffff; border-left:1px solid #f0e0cc; border-right:1px solid #f0e0cc; padding:32px 32px 28px;">

              <!-- Headline -->
              <p style="margin:0 0 2px; font-family:'Segoe UI',Arial,sans-serif; font-size:10px;
                         font-weight:700; color:{{ primary_color }}; letter-spacing:0.16em; text-transform:uppercase;">
                Your digest
              </p>
              <h1 style="margin:0 0 24px; font-size:22px; font-weight:700; color:#111;
                          line-height:1.3; font-family:'Georgia', serif; border-bottom:2px solid #111; padding-bottom:14px;">
                What top engineers<br>shipped this week
              </h1>

              <!-- Dynamic category sections injected here -->
              {{ category_sections | safe }}

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background:#ffffff; border-left:1px solid #f0e0cc; border-right:1px solid #f0e0cc;
                        border-bottom:1px solid #f0e0cc; border-top:1px solid #ccc;
                        border-radius:0 0 10px 10px; padding:14px 32px;">
              <table width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="vertical-align:middle; padding-right:12px; width:1%;">
                    <a href="https://onesearch.blog" target="_blank" rel="noopener noreferrer">
                      <img src="https://onesearch.blog/static/logo.png" alt="Onesearch" width="36" height="36"
                           style="display:block; border-radius:8px; border:1px solid #f0e0cc;">
                    </a>
                  </td>
                  <td style="vertical-align:middle;">
                    <a href="https://onesearch.blog" target="_blank" rel="noopener noreferrer"
                       style="font-family:'Segoe UI',Arial,sans-serif; font-size:13px;
                              font-weight:700; color:{{ primary_color }}; text-decoration:none;">Onesearch</a>
                    <p style="margin:2px 0 0; font-family:'Segoe UI',Arial,sans-serif;
                               font-size:11px; color:#888; line-height:1.5;">
                      One place for all engineering blogs, curated for you.
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
